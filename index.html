<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Size &amp; Rehab Coach</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141a" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column for gym use; status bar sticks to the top, tab bar sits at the bottom.
   Palette: chalk-grey ground, competition-plate blue as the accent, plate colours for loading hints. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#e1e6eb; --ink:#111b25; --muted:#51606e; --line:#cbd3db;
  --accent:#1d4ed8; --accent-soft:#dbe4ff; --on-accent:#ffffff;
  --go:#1b7a45; --go-soft:#d8efe2; --hold:#9a6208; --hold-soft:#f6e8cf; --stop:#b92c2c; --stop-soft:#f7dcdc;
  --plate-25:#c62828; --plate-20:#1d4ed8; --plate-15:#e0b400; --plate-10:#1f8a4c; --plate-5:#f4f4f2; --plate-2:#9aa3ad;
  --plate-ink:#ffffff; --plate-ink-dark:#151515;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#161f28; --sunk:#1e2833; --ink:#e5ecf2; --muted:#98a7b5; --line:#2a3744;
    --accent:#7ea2ff; --accent-soft:#1f2c4d; --on-accent:#0a1222;
    --go:#53c48c; --go-soft:#173426; --hold:#e2ac52; --hold-soft:#3a2c14; --stop:#f07a7a; --stop-soft:#3d1c1c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunk:#1e2833; --ink:#e5ecf2; --muted:#98a7b5; --line:#2a3744;
  --accent:#7ea2ff; --accent-soft:#1f2c4d; --on-accent:#0a1222;
  --go:#53c48c; --go-soft:#173426; --hold:#e2ac52; --hold-soft:#3a2c14; --stop:#f07a7a; --stop-soft:#3d1c1c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
button,.tab,.chip,.link,summary,.vid,label.check{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.top-row{display:flex;align-items:center;gap:8px}
.icon-btn{appearance:none;position:relative;border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;margin-right:-8px}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--bg)}
.icon-btn .dot.go{background:var(--go)} .icon-btn .dot.hold{background:var(--hold)} .icon-btn .dot.stop{background:var(--stop)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.65rem;letter-spacing:.01em}
h3{font-size:1.22rem}
p{margin:0}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in,.wrap,.tabs-in,.rest-in{max-width:640px;margin:0 auto}
.top-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{flex:1;min-width:0;font:700 1.12rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.status{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.status:empty{display:none}
.pill{font:600 .78rem/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.pill.go{background:var(--go-soft);color:var(--go)}
.pill.hold{background:var(--hold-soft);color:var(--hold)}
.pill.stop{background:var(--stop-soft);color:var(--stop)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 140px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font:600 .74rem/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flag-hold{border-color:var(--hold)}
.card.flag-stop{border-color:var(--stop)}
.card.flag-blue{border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem/1.1 var(--body);padding:11px 16px;border-radius:8px;min-height:44px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{appearance:none;background:none;border:0;color:var(--accent);font:600 .95rem/1.2 var(--body);padding:6px 0;cursor:pointer;text-align:left}
.vid{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font:600 .92rem/1.2 var(--body);text-decoration:none;padding:4px 0}
.vid:hover{text-decoration:underline}
.vid svg{width:13px;height:13px;flex:none}
.prep-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prep-row .vid{flex:none;font-size:.85rem}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.vid:focus-visible,.tab:focus-visible,.done-btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .93rem/1 var(--body);padding:9px 12px;border-radius:999px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.n{min-width:36px;padding:9px 0;text-align:center}
.chip.n.v-go[aria-pressed="true"]{background:var(--go);border-color:var(--go)}
.chip.n.v-hold[aria-pressed="true"]{background:var(--hold);border-color:var(--hold)}
.chip.n.v-stop[aria-pressed="true"]{background:var(--stop);border-color:var(--stop)}
.q{display:flex;flex-direction:column;gap:6px}
.q-label{font:500 .9rem/1.3 var(--body);color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],textarea,select{font:500 1rem/1.3 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
/* Next-up */
.next-day{font:700 2.4rem/1 var(--display);letter-spacing:.01em}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.daypick .chip{border-radius:8px;text-align:left;padding:10px 12px;line-height:1.2}
/* Logger */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ex.is-skipped{opacity:.62}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head h3{min-width:0}
.ex-num{font:600 .8rem/1 var(--body);color:var(--muted);letter-spacing:.08em}
.pres{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.pres .w{font:700 1.75rem/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.pres .sr{font:600 1.1rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tag{font:600 .74rem/1 var(--body);padding:5px 8px;border-radius:4px;background:var(--hold-soft);color:var(--hold)}
.plates{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.plate{font:700 .78rem/1 var(--display);padding:5px 6px;border-radius:3px;min-width:28px;text-align:center;color:var(--plate-ink)}
.plate.p25{background:var(--plate-25)} .plate.p20{background:var(--plate-20)} .plate.p15{background:var(--plate-15);color:var(--plate-ink-dark)}
.plate.p10{background:var(--plate-10)} .plate.p5{background:var(--plate-5);color:var(--plate-ink-dark);box-shadow:inset 0 0 0 1px var(--line)} .plate.p2{background:var(--plate-2);color:var(--plate-ink-dark)}
.sets{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr) 3.4rem;gap:8px;align-items:center}
.sets .hd{font:600 .7rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:center}
.setrow{display:contents}
.set-idx{font:600 1.05rem var(--display);color:var(--muted);text-align:center}
.num-in{height:46px;text-align:center;font:600 1.2rem/1 var(--display)!important;font-variant-numeric:tabular-nums;padding:0 6px!important}
.setrow.done .num-in{background:var(--go-soft);border-color:var(--go)}
.done-btn{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.done-btn svg{width:22px;height:22px}
.done-btn[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--on-accent)}
.bw-cell{font:500 .9rem var(--body);color:var(--muted);text-align:center}
details.prep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.prep summary{cursor:pointer;padding:14px 16px;font:600 1.1rem var(--display);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.prep summary::-webkit-details-marker{display:none}
details.prep .prep-list{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:22px;height:22px;min-height:0;margin-top:1px;flex:none;accent-color:var(--accent)}
.verdicts{display:flex;flex-direction:column;gap:8px}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.verdict .pill{justify-self:start}
.warn{background:var(--hold-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.95rem}
.warn.stop{background:var(--stop-soft)}
/* History */
.trends{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.trend .big{font:700 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}
.trend svg{width:100%;height:auto;display:block;color:var(--accent)}
.trend .axis{stroke:var(--line)}
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sess summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
details.sess summary::-webkit-details-marker{display:none}
.sess-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.sess-line{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.sess-line b{font-weight:600}
/* Program */
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem .meta{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.editor{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding-top:6px}
.editor label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.loglist{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.logitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
/* Coach */
.msg{display:flex;flex-direction:column;gap:10px}
.msg .who{font:600 .74rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.msg.you .bubble{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap}
.reply{white-space:pre-wrap}
.change{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.change .why{font-size:.88rem;color:var(--muted)}
.change .row{margin-top:2px}
.composer{position:relative;display:flex;flex-direction:column;gap:8px}
/* Fixed bars */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{appearance:none;background:none;border:0;border-top:3px solid transparent;padding:12px 2px 14px;font:600 .9rem/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.rest{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:11;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.rest-in{display:flex;justify-content:flex-end}
.rest-box{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font:600 1rem var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.rest-box button{appearance:none;border:0;background:transparent;color:var(--bg);font:600 .85rem var(--body);padding:6px 10px;border-radius:999px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:13;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.95rem;max-width:min(92vw,520px)}
@media (prefers-reduced-motion: no-preference){ .toast{transition:opacity .2s} }
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">Size &amp; Rehab Coach</div>
  <button class="icon-btn" type="button" id="settings-btn" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.5 7.5 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4.9 2-3.4Z"/></svg><span class="dot" id="sync-dot"></span></button>
  <div class="status" id="status"></div>
</div></header>
<main class="wrap" id="main"><div class="card"><p class="muted">Loading your program…</p></div></main>
<div class="rest" id="rest" hidden><div class="rest-in"><div class="rest-box"><span id="rest-text">Rest 0:00</span><button type="button" id="rest-close">Hide</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" type="button" data-tab="today" id="tab-today">Today</button>
  <button class="tab" type="button" data-tab="program" id="tab-program">Program</button>
  <button class="tab" type="button" data-tab="history" id="tab-history">History</button>
  <button class="tab" type="button" data-tab="coach" id="tab-coach">Coach</button>
</div></nav>

<script>
(() => {

function weekNo(p, date = todayStr()) {

function slotExId(p, slot, date) {

function dayItems(p, dayKey, date = todayStr()) {

  else if (wk <= 2 && ex.lower) { sets = Math.max(1, sets - 1); tag = 'Weeks 1–2: one set fewer'; }
  if (ex.setAdj && ex.setAdj.until >= date && wk !== 12) { sets = Math.max(1, sets + ex.setAdj.delta); tag = ex.setAdj.why; }

/* Warm-up sets before the first heavy lift; not logged. */
function rampSets(ex, w) {

  if (ex.unit === 'kg added') return ['Bodyweight × 5', `+${fmtNum(r05(w / 2))} kg × 3`];
  const inc = ex.inc || 2.5; const rd = x => Math.round(x / inc) * inc;

  for (const [f, r] of steps) { const v = rd(w * f); if (v > last && v < w) { out.push(`${fmtNum(v)} × ${r}`); last = v; } }
  return out.length ? out : null;
}
function shoulderLight(s) {

}

/* Double progression with the back rules on top. Mutates ex (and p.holds); returns what happened. */
function progress(p, ex, entry, date) {
  const done = entry.sets.filter(s => s.done && (s.r || 0) > 0);

  const W = ws.length ? Math.max(...ws) : 0;
  const atW = done.filter(s => (s.w == null ? 0 : Number(s.w)) === W);
  const reps = atW.map(s => Number(s.r));
  const lo = ex.lo, hi = ex.hi, inc = ex.inc || 2.5;
  const rir = entry.rir == null ? null : Number(entry.rir);
  const backC = ex.back ? classifyPain(entry.pain) : 'green';
  const shC = ex.shoulder ? classifyPain(entry.shoulderPain) : 'green';
  const rank = { green: 0, amber: 1, red: 2 };
  const shWorse = rank[shC] > rank[backC];

  const presSets = entry.presSets || ex.sets;
  const allTop = atW.length >= presSets && reps.every(r => r >= hi);
  const below = reps.some(r => r < lo);
  const bw = ex.unit === 'bw';

  const wk = weekNo(p, date);
  let verdict = 'hold', msg = '';
  if (!loadKnown) { return { W, verdict: 'hold', msg: 'No weight entered, so nothing changed. Enter the weight next time.' }; }
  const minReps = Math.min(...reps);

  if (pain === 'red') {
    if (!bw) ex.weight = r05(W * 0.8);
    ex.aim = lo; verdict = 'down';
    msg = `${painLabel}: load down 20% and one set fewer for a week.`;
    ex.setAdj = { delta: -1, until: addDays(date, 7), why: shWorse ? 'Shoulder flare: one set fewer this week' : 'Back flare: one set fewer this week' };
    if (ex.slot && p.phase > 1 && backC === 'red') {

      p.holds.push({ slot: ex.slot, phase: p.phase - 1, until: addDays(date, 7) });
      msg += ` This movement goes back to its Phase ${p.phase - 1} version for a week.`;
    }

  } else if (allTop && (rir == null || rir >= ex.rirLo)) {

}

function applyMorning(p, s, val) {
  s.morning = val;
  const notes = [];
  if (val === 'normal') return notes;
  const today = todayStr();
  for (const e of s.entries || []) {
    const ex = p.exercises[e.exId];
    if (!ex || !ex.back || e.skipped || !e.after) continue;
    const W = e.usedW;
    if (val === 'stiff') {
      if (ex.unit !== 'bw' && W != null && ex.weight > W) { ex.weight = W; ex.aim = e.before?.aim ?? ex.aim; notes.push(`${ex.name} held at ${fmtW(ex, W)}`); }
    } else if (val === 'worse') {
      if (ex.unit !== 'bw' && W != null) ex.weight = r05(W * 0.9);
      ex.setAdj = { delta: -1, until: addDays(today, 7), why: 'Worse next morning: one set fewer this week' };
      if (ex.slot && p.phase > 1) {
        p.holds = (p.holds || []).filter(x => x.slot !== ex.slot);
        p.holds.push({ slot: ex.slot, phase: p.phase - 1, until: addDays(today, 7) });
      }

function gateStatus(p) {

    const green = ls.length >= 2 && ls.every(s => sessionLight(s) === 'green' && s.morning === 'normal');

      need: 'Two straight green weeks with at least two leg sessions, every next-morning check normal.',
      checks: ['I can hold a 30-second side plank on my feet, each side', 'My dowel hinge is clean: head, upper back and tailbone stay on the dowel'], required: 2 };
  }

      checks: ['The rehab centre has assessed me (ideal, not required)'], required: 0 };

function advancePhase(n, how) {

const DATA_KEY = 'src-data-v1', SYNC_KEY = 'src-sync-v1', SET_KEY = 'src-settings-v1';
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
const Store = {
  data: Object.assign({ docs: {}, sessions: {}, coach: {}, draft: null }, lsGet(DATA_KEY) || {}),
  sync: Object.assign({ url: '', lastPull: 0, pending: {}, syncedAt: {}, lastOk: 0, lastError: '' }, lsGet(SYNC_KEY) || {}),
  saveData() { if (!lsSet(DATA_KEY, this.data)) toast('Your phone is out of storage for this app. Free some space so changes keep saving.'); },
  saveSync() { lsSet(SYNC_KEY, this.sync); },
  enqueue(item) { this.sync.pending[`${item.kind}:${item.key || item.id}`] = item; this.saveSync(); Sync.soon(); },
  get(path) {

    if (col === 'sessions') return clone(this.data.sessions[id] || null);

  },
  set(path, val) {

    if (path === 'coach/thread') {

        this.data.coach[it.id] = clone(it);

    }

const Sync = {
  timer: null, running: false,
  soon(ms = 1500) { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  async run(opts = {}) {
    const s = Store.sync;
    if (!s.url) { updateSyncDot(); return false; }
    if (this.running) return false;
    if (!navigator.onLine) { updateSyncDot(); return false; }
    this.running = true; updateSyncDot();
    let changed = false;
    try {
      await this.push();
      changed = await this.pull(opts.full);
      s.lastOk = Date.now(); s.lastError = '';
    } catch (e) {
      s.lastError = (e && e.message) || String(e);
    } finally {
      this.running = false; Store.saveSync(); updateSyncDot();
    }
    if (changed) onRemoteChange();
    if (S.tab === 'settings') renderMain();
    if (!Store.sync.lastError) runDueReview();
    return !Store.sync.lastError;
  },
  async push() {
    const s = Store.sync; const items = Object.values(s.pending);
    if (!items.length) return;
    const sent = {}; for (const it of items) sent[`${it.kind}:${it.key || it.id}`] = it.json;
    const res = await fetch(s.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ op: 'push', items }) });
    const out = await res.json();
    if (out.error) throw new Error(out.error);
    for (const u of out.updated || []) {
      const k = `${u.kind}:${u.id}`;
      if (s.pending[k] && s.pending[k].json === sent[k]) delete s.pending[k];
      if (u.kind === 'doc') s.syncedAt[u.id] = u.updatedAt;
    }
  },
  async pull(full) {
    const s = Store.sync; const d = Store.data;
    const since = full ? 0 : Math.max(0, (s.lastPull || 0) - 5 * 60 * 1000);
    const res = await fetch(`${s.url}${s.url.includes('?') ? '&' : '?'}op=pull&since=${since}`);
    const out = await res.json();
    if (out.error) throw new Error(out.error);
    let changed = false;
    for (const [key, doc] of Object.entries(out.docs || {})) {
      if (s.pending[`doc:${key}`]) continue;
      if ((doc.updatedAt || 0) > (s.syncedAt[key] || 0) || !d.docs[key]) {
        try { d.docs[key] = JSON.parse(doc.json); s.syncedAt[key] = doc.updatedAt; changed = true; } catch (e) {}
      }
    }
    for (const [coll, kind] of [['sessions', 'session'], ['coach', 'coach']]) {
      for (const row of out[coll] || []) {
        if (s.pending[`${kind}:${row.id}`]) continue;
        if (JSON.stringify(d[coll][row.id] || null) === row.json) continue;
        try { d[coll][row.id] = JSON.parse(row.json); changed = true; } catch (e) {}
      }
    }
    s.lastPull = out.now || Date.now();
    if (changed) Store.saveData();
    return changed;
  },
};
function syncState() {

  return 'ok';
}

// The Sunday check-in can't edit the program itself: it leaves its changes in the coach tab with

let applyingIncoming = false;
async function applyIncoming() {
  if (applyingIncoming || !S.program || !S.thread) return;
  const items = (S.thread.items || []).filter(it => it && it.applyOnSync);
  if (!items.length) return;
  applyingIncoming = true;
  try {

      it.applyOnSync = false;
      it.changes = (Array.isArray(it.changes) ? it.changes : []).slice(0, 6).map(validateChange).filter(Boolean);
      const now = it.changes.filter(c => !needsTap(c));

  } finally { applyingIncoming = false; }
}

function parseJsonLoose(text) {
  const t = String(text || '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) { try { return JSON.parse(fence[1]); } catch (e) {} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: 'invalid_json', message: 'Reply was not JSON', text: t };
}

  root.append(h('div', {}, h('div', { class: 'eyebrow', text: 'Settings' }), h('h2', { text: 'Data and coach' })));

  // sheet link
  const s = Store.sync; const st = syncState();
  const sheetCard = h('div', { class: 'card' }, h('h3', { text: 'Google Sheet' }));
  const url = h('input', { type: 'url', id: 'sheet-url', placeholder: 'https://script.google.com/macros/s/…/exec', value: s.url || '', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  sheetCard.append(h('label', { class: 'q', for: 'sheet-url' }, h('span', { class: 'q-label', text: 'Web app link (from Extensions > Apps Script > Deploy)' }), url));
  const dl = h('dl', { class: 'kv' },
    h('dt', { text: 'Status' }), h('dd', { text: st === 'off' ? 'Not connected' : st === 'ok' ? 'Up to date' : st === 'pending' ? (navigator.onLine ? 'Changes waiting to upload' : 'Offline: changes are saved on the phone') : 'Problem reaching the sheet' }),
    h('dt', { text: 'Last synced' }), h('dd', { text: ago(s.lastOk) }),
    h('dt', { text: 'Waiting' }), h('dd', { text: `${Store.pendingCount()} change${Store.pendingCount() === 1 ? '' : 's'}` }));
  if (s.lastError) dl.append(h('dt', { text: 'Error' }), h('dd', { text: s.lastError }));
  sheetCard.append(dl);
  sheetCard.append(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', text: s.url && url.value === s.url ? 'Sync now' : 'Connect', disabled: S.connecting || Sync.running,
      onclick: () => { if (url.value.trim() !== s.url) connectSheet(url.value); else Sync.run().then(ok => toast(ok ? 'Synced.' : 'Sync failed: ' + Store.sync.lastError)); } })));
  url.addEventListener('input', () => { const b = sheetCard.querySelector('.btn.primary'); if (b) b.textContent = url.value.trim() && url.value.trim() === s.url ? 'Sync now' : 'Connect'; });
  root.append(sheetCard);

  // API key
  const keyCard = h('div', { class: 'card' }, h('h3', { text: 'Coach (Claude API)' }),
    h('p', { class: 'small muted', text: 'Used for the review after each session and for questions you send. The key stays on this phone and is sent only to Anthropic.' }));
  const key = h('input', { type: 'password', id: 'api-key', placeholder: 'sk-ant-…', value: Settings.apiKey || '', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  const model = h('select', { id: 'model' }, [['claude-sonnet-5-5', 'Sonnet 5.5 (recommended)'], ['claude-opus-5-5', 'Opus 5.5'], ['claude-haiku-5-5', 'Haiku 5.5']]
    .map(([v, t]) => h('option', { value: v, selected: Settings.model === v ? 'selected' : null, text: t })));
  keyCard.append(h('label', { class: 'q', for: 'api-key' }, h('span', { class: 'q-label', text: 'API key' }), key));
  keyCard.append(h('label', { class: 'q', for: 'model' }, h('span', { class: 'q-label', text: 'Model' }), model));
  const keyMsg = h('p', { class: 'small', 'aria-live': 'polite' });
  keyCard.append(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', text: 'Save', onclick: () => { Settings.apiKey = key.value.trim(); Settings.model = model.value; saveSettings(); toast(Settings.apiKey ? 'Saved. The coach is on.' : 'Key removed. The coach is off.'); renderMain(); } }),
    h('button', { class: 'btn', type: 'button', text: 'Check key', onclick: async ev => {
      const btn = ev.currentTarget; btn.disabled = true; keyMsg.textContent = 'Checking…';
      const keep = { apiKey: Settings.apiKey, model: Settings.model };
      Settings.apiKey = key.value.trim(); Settings.model = model.value;
      try { await callClaude('Reply with {"ok":true}', { maxTokens: 20 }); keyMsg.textContent = 'The key works.'; }
      catch (e) { keyMsg.textContent = errorCopy(e); }
      finally { Settings.apiKey = keep.apiKey; Settings.model = keep.model; btn.disabled = false; }
    } })), keyMsg);
  root.append(keyCard);

  if (!isStandalone()) root.append(installHint());
  root.append(h('p', { class: 'small muted', text: 'Everything you log is saved on this phone first and uploads to the sheet when you’re online. The Sunday check-in reads the sheet.' }));
  return root;
}
function markTab() {
  for (const b of document.querySelectorAll('.tab')) b.removeAttribute('aria-current');
  const tb = document.querySelector(`.tab[data-tab="${S.tab}"]`); if (tb) tb.setAttribute('aria-current', 'page');
}

/* ---------- boot ---------- */
for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => setTab(b.dataset.tab));
$('#settings-btn').addEventListener('click', () => setTab(S.tab === 'settings' ? 'today' : 'settings'));

function start() {
  S.ready = true;
  loadFromStore();
  const d = Store.get('app/draft');
  if (d && d.session) { S.active = d.session; S.resumed = true; }
  if (!S.program && !Store.sync.url) S.tab = 'settings';
  markTab(); renderTop(); renderMain(); updateSyncDot();
  applyIncoming();
  if (Store.sync.url) Sync.run();
  window.addEventListener('online', () => Sync.run());
  window.addEventListener('offline', updateSyncDot);
  let lastVis = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastVis > 30000) { lastVis = Date.now(); Sync.run(); }
  });
  setInterval(() => { if (document.visibilityState === 'visible') Sync.run(); }, 5 * 60 * 1000);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
start();
})();
</script>
</body>
