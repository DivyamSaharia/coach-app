<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Size &amp; Rehab Coach</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1322" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Coach. One phone-width column for gym use.
   Colour comes from competition plates: 20 kg blue for actions, 15 kg yellow for XP, 25 kg red for PRs,
   10 kg green for "go". The rank badge is a bumper plate in the tier's colour. */
:root{
  --bg:#f1f4ff; --surface:#ffffff; --raised:#f8f9ff; --sunk:#e1e7fb; --ink:#0e1530; --muted:#505c7c; --line:#ccd5f2;
  --accent:#0779a6; --accent2:#6d3cf0; --accent-soft:#d8f3ff; --on-accent:#ffffff;
  --xp:#f0b400; --xp-ink:#7a5a00; --xp-soft:#fff3c4;
  --pr:#e5246b; --pr-soft:#ffe1ec;
  --go:#17804a; --go-soft:#d8f0e3; --hold:#9a6208; --hold-soft:#f8ead0; --stop:#b92c2c; --stop-soft:#f8dcdc;
  --hub:#0e1630;
  --plate-25:#d92d3a; --plate-20:#2454e6; --plate-15:#f0b400; --plate-10:#17804a; --plate-5:#f4f4f2; --plate-2:#9aa3ad;
  --plate-ink:#ffffff; --plate-ink-dark:#151515;
  --display:"Chakra Petch","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(14,22,48,.04),0 6px 18px -10px rgba(14,22,48,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1322; --surface:#161d31; --raised:#1b243c; --sunk:#1f2944; --ink:#eef3ff; --muted:#9ea9c8; --line:#2b3657;
    --accent:#5ee7ff; --accent2:#9b6bff; --accent-soft:#123448; --on-accent:#04141c;
    --xp:#ffd34d; --xp-ink:#ffd34d; --xp-soft:#352c0e;
    --pr:#ff5c8a; --pr-soft:#3f1730;
    --go:#34d399; --go-soft:#0f3328; --hold:#f2b544; --hold-soft:#3a2c14; --stop:#ff6b6b; --stop-soft:#3d1c22;
    --hub:#0e1322; --shadow:0 1px 0 rgba(0,0,0,.25),0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --raised:#1b243c; --sunk:#1f2944; --ink:#eef3ff; --muted:#9ea9c8; --line:#2b3657;
  --accent:#5ee7ff; --accent2:#9b6bff; --accent-soft:#123448; --on-accent:#04141c;
  --xp:#ffd34d; --xp-ink:#ffd34d; --xp-soft:#352c0e;
  --pr:#ff5c8a; --pr-soft:#3f1730;
  --go:#34d399; --go-soft:#0f3328; --hold:#f2b544; --hold-soft:#3a2c14; --stop:#ff6b6b; --stop-soft:#3d1c22;
  --hub:#0e1322; --shadow:0 1px 0 rgba(0,0,0,.25),0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
button,.tab,.chip,.link,summary,.vid,label.check{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.num,.tnum{font-variant-numeric:tabular-nums}
.icon-btn{appearance:none;position:relative;border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;margin-right:-8px}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--bg)}
.icon-btn .dot.go{background:var(--go)} .icon-btn .dot.hold{background:var(--hold)} .icon-btn .dot.stop{background:var(--stop)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:1.6rem}
h3{font-size:1.18rem}
p{margin:0}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in,.wrap,.tabs-in,.rest-in{max-width:640px;margin:0 auto}
.top-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font:600 1.12rem/1 var(--display)}
.brand .mini{width:26px;height:26px;flex:none}
.brand small{font:500 .82rem/1 var(--body);color:var(--muted)}
.status{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.status:empty{display:none}
.pill{font:600 .78rem/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.go{background:var(--go-soft);color:var(--go)}
.pill.hold{background:var(--hold-soft);color:var(--hold)}
.pill.stop{background:var(--stop-soft);color:var(--stop)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.xp{background:var(--xp-soft);color:var(--xp-ink)}
.pill.pr{background:var(--pr-soft);color:var(--pr)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 150px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 .86rem/1.25 var(--body);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.flag-hold{border-color:var(--hold)}
.card.flag-stop{border-color:var(--stop)}
.card.flag-blue{border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:600 1rem/1.1 var(--body);padding:11px 16px;border-radius:var(--r-sm);min-height:44px;cursor:pointer;text-align:center}
.btn.primary{background:linear-gradient(100deg,var(--accent),var(--accent2));border-color:transparent;color:var(--on-accent);box-shadow:0 10px 22px -12px var(--accent2)}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font:600 1.15rem/1.1 var(--display);min-height:54px;padding:14px 20px}
.link{appearance:none;background:none;border:0;color:var(--accent);font:600 .95rem/1.2 var(--body);padding:6px 0;cursor:pointer;text-align:left}
.vid{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font:600 .92rem/1.2 var(--body);text-decoration:none;padding:4px 0}
.vid:hover{text-decoration:underline}
.vid svg{width:13px;height:13px;flex:none}
.prep-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prep-row .vid{flex:none;font-size:.85rem}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.vid:focus-visible,.tab:focus-visible,.done-btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,.hud:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:500 .93rem/1 var(--body);padding:9px 12px;border-radius:999px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.n{min-width:36px;padding:9px 0;text-align:center;font-family:var(--display);font-weight:600}
.chip.n.v-go[aria-pressed="true"]{background:var(--go);border-color:var(--go)}
.chip.n.v-hold[aria-pressed="true"]{background:var(--hold);border-color:var(--hold);color:#1b1300}
.chip.n.v-stop[aria-pressed="true"]{background:var(--stop);border-color:var(--stop)}
.q{display:flex;flex-direction:column;gap:6px}
.q-label{font:500 .9rem/1.3 var(--body);color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],textarea,select{font:500 1rem/1.3 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}

/* Rank HUD */
.emblem{display:block;flex:none}
.hud{appearance:none;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--tier) 26%,transparent),transparent 60%),var(--surface);box-shadow:var(--shadow)}
.hud-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.rank-name{font:700 1.55rem/1 var(--display);letter-spacing:-.01em}
.rank-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.rank-xp{font:600 .9rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{position:relative;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.xpbar>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--xp) 70%,#fff 0%),var(--xp));box-shadow:0 0 12px -2px var(--xp)}
.xpbar.thin{height:6px}
.xpbar.blue>i{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:none}
.xpbar.go>i{background:var(--go);box-shadow:none}
.hud-sub{font-size:.86rem;color:var(--muted);margin-top:6px}
.hud-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.streak{display:inline-flex;align-items:center;gap:6px;font:600 .86rem/1 var(--body);padding:6px 10px 6px 8px;border-radius:999px;background:var(--pr-soft);color:var(--pr)}
.streak svg{width:15px;height:15px}
.streak.cold{background:var(--sunk);color:var(--muted)}

/* Quests */
.quests{display:flex;flex-direction:column;gap:12px}
.quest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.quest .qname{font-weight:600;font-size:.95rem}
.quest .qxp{font:600 .82rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums}
.quest .xpbar{grid-column:1/-1}
.quest.done .qname{color:var(--go)}
.quest.missed .qname{color:var(--muted);text-decoration:line-through}
.quest .qstate{font-size:.82rem;color:var(--muted);grid-column:1/-1;margin-top:-2px}

/* Next-up */
.next-day{font:700 2.5rem/.95 var(--display);letter-spacing:-.015em}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.daypick .chip{border-radius:var(--r-sm);text-align:left;padding:10px 12px;line-height:1.2}
.exlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.exlist li:first-child{border-top:0}
.exlist .t{font:600 .95rem/1.2 var(--display);color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.exlist .s{color:var(--muted);font-size:.85rem;grid-column:1/-1}

/* Logger */
.live{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(var(--top-h,64px) + 8px);z-index:5;padding:10px 14px;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.live-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.live-xp{font:700 1.1rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);transition:border-color .2s}
.ex.is-skipped{opacity:.62}
.ex.is-done{border-color:color-mix(in srgb,var(--go) 60%,var(--line))}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head h3{min-width:0}
.ex-num{font:600 .8rem/1 var(--body);color:var(--muted);display:flex;gap:8px;align-items:center}
.ex-prog{font:600 .78rem/1 var(--display);padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.ex.is-done .ex-prog{background:var(--go-soft);color:var(--go)}
.pr-flag{font:700 .72rem/1 var(--display);padding:4px 7px;border-radius:6px;background:var(--pr);color:#fff;letter-spacing:.04em}
.pres{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.pres .w{font:700 1.9rem/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.pres .sr{font:600 1.08rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tag{font:600 .78rem/1.2 var(--body);padding:5px 8px;border-radius:6px;background:var(--hold-soft);color:var(--hold);display:inline-block}
.plates{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.plate{font:700 .78rem/1 var(--display);padding:5px 6px;border-radius:4px;min-width:28px;text-align:center;color:var(--plate-ink)}
.plate.p25{background:var(--plate-25)} .plate.p20{background:var(--plate-20)} .plate.p15{background:var(--plate-15);color:var(--plate-ink-dark)}
.plate.p10{background:var(--plate-10)} .plate.p5{background:var(--plate-5);color:var(--plate-ink-dark);box-shadow:inset 0 0 0 1px var(--line)} .plate.p2{background:var(--plate-2);color:var(--plate-ink-dark)}
.sets{display:grid;grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr) 3.6rem;gap:8px;align-items:center}
.sets .hd{font:600 .78rem/1 var(--body);color:var(--muted);text-align:center}
.setrow{display:contents}
.set-idx{font:600 1.05rem var(--display);color:var(--muted);text-align:center}
.num-in{height:48px;text-align:center;font:600 1.25rem/1 var(--display)!important;font-variant-numeric:tabular-nums;padding:0 6px!important;transition:background-color .2s,border-color .2s}
.setrow.done .num-in{background:var(--go-soft);border-color:var(--go)}
.setrow.pr .num-in{background:var(--pr-soft);border-color:var(--pr)}
.done-btn{height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--raised);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.done-btn svg{width:24px;height:24px}
.done-btn[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff}
.setrow.pr .done-btn[aria-pressed="true"]{background:var(--pr);border-color:var(--pr)}
.bw-cell{font:500 .9rem var(--body);color:var(--muted);text-align:center}
details.prep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
details.prep summary{cursor:pointer;padding:14px 16px;font:600 1.08rem var(--display);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.prep summary::-webkit-details-marker{display:none}
details.prep.full summary .small{color:var(--go)}
details.prep .prep-list{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:22px;height:22px;min-height:0;margin-top:1px;flex:none;accent-color:var(--accent)}
.verdicts{display:flex;flex-direction:column;gap:8px}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.verdict .pill{justify-self:start}
.warn{background:var(--hold-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:.95rem}
.warn.stop{background:var(--stop-soft)}

/* Results */
.results{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(110% 120% at 50% 0%,color-mix(in srgb,var(--tier) 30%,transparent),transparent 62%),var(--surface);box-shadow:var(--shadow)}
.res-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.res-xp{font:700 3rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res-xp small{font-size:1.1rem;margin-left:4px}
.res-rank{display:flex;align-items:center;gap:12px;width:100%}
.res-rank .grow{flex:1;min-width:0}
.rankup{align-self:center;font:700 1rem/1 var(--display);padding:8px 14px;border-radius:999px;background:var(--xp);color:#1b1300;letter-spacing:.02em}
.parts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:.93rem;margin:0}
.parts dt{color:var(--muted)} .parts dd{margin:0;font:600 .95rem/1.3 var(--display);color:var(--xp-ink);text-align:right;font-variant-numeric:tabular-nums}
.prlist{display:flex;flex-direction:column;gap:6px}
.pritem{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--pr-soft)}
.pritem b{font-family:var(--display)}
.pritem .pr-flag{flex:none}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:34%;width:7px;height:12px;border-radius:2px;opacity:0}

/* Rank view */
.rank-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 16px 18px;border-radius:var(--r);border:1px solid var(--line);
  background:radial-gradient(90% 120% at 50% 0%,color-mix(in srgb,var(--tier) 34%,transparent),transparent 65%),var(--surface);box-shadow:var(--shadow)}
.rank-hero .rank-name{font-size:2.1rem}
.rank-hero .xpbar{width:100%;max-width:420px}
.lifts{display:flex;flex-direction:column;gap:14px}
.lift{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.lift .lname{font-weight:600}
.lift .ltier{font:600 1.05rem/1.1 var(--display)}
.lift .xpbar,.lift .lnext{grid-column:2}
.lift .lnext{font-size:.85rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 1.4rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--raised)}
.badge b{font:600 1rem/1.15 var(--display)}
.badge span{font-size:.84rem;color:var(--muted)}
.badge.got{border-color:color-mix(in srgb,var(--xp) 70%,var(--line));background:linear-gradient(160deg,var(--xp-soft),var(--raised) 70%)}

function parseJsonLoose(text) {

async function callClaude(input, opts = {}) {

  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: opts.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': Settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: opts.model || Settings.model || 'claude-sonnet-5-5', max_tokens: opts.maxTokens || 2500,

    });

async function finishSession() {
  const a = S.active, p = S.program; if (!a) return;
  const btn = document.getElementById('finish-btn'); if (btn) btn.disabled = true;
  const prog = clone(p);

    return;

  root.append(h('div', {}, h('div', { class: 'eyebrow', text: 'Claude reads your program and the last three weeks' }), h('h2', { text: 'Coach' })));
  const avail = coachReady();
  if (!avail) root.append(h('div', { class: 'card' }, h('p', { text: 'Add your Claude API key in Settings to turn the coach on. Logging, automatic weight changes and the Sunday check-in work without it.' }),
    h('div', {}, h('button', { class: 'btn primary', type: 'button', text: 'Open Settings', onclick: () => setTab('settings') }))));
  if (avail) {
    const on = S.program.settings?.autoReview !== false;
    root.append(h('label', { class: 'check card', for: 'auto-review', style: 'flex-direction:row' },
      h('input', { type: 'checkbox', id: 'auto-review', checked: on, onchange: async ev => {
        S.program.settings = { ...(S.program.settings || {}), autoReview: ev.target.checked };
        try { await saveProgram(); toast(ev.target.checked ? 'The coach will review each session when you finish.' : 'Automatic reviews are off.'); } catch (e) { toast('Couldn’t save that setting.'); }
      } }),
      h('span', {}, h('b', { text: 'Review every session automatically' }), h('br'), h('span', { class: 'small muted', text: 'Runs when you tap Finish. Small changes apply straight away with an Undo; exercise swaps and weight jumps over 15% wait for you. A weekly check-in also runs every Sunday night.' }))));
  }
  if (avail) root.append(h('div', { class: 'row' },
    h('button', { class: 'btn', type: 'button', text: 'Review my last session', disabled: S.coachBusy || !ownSessions().length, onclick: () => askCoach('review') }),
    h('button', { class: 'btn', type: 'button', text: 'Weekly check-in', disabled: S.coachBusy, onclick: () => askCoach('weekly') })));
  const items = S.thread.items || [];
  if (!items.length) root.append(h('p', { class: 'muted small', text: 'After a session, ask for a review. The coach suggests changes you can apply or dismiss, and asks you questions when it needs more to go on.' }));
  for (const it of items) root.append(coachItem(it));
  if (avail) {
    const ta = h('textarea', { id: 'coach-input', placeholder: 'Tell the coach something or ask a question. For example: “The leg press machine was taken, what should I use instead?”' });
    if (S.coachDraft) ta.value = S.coachDraft;
    ta.addEventListener('input', () => { S.coachDraft = ta.value; });
    const comp = h('div', { class: 'composer card' }, h('label', { class: 'q-label', for: 'coach-input', text: 'Message the coach' }), ta,
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', text: 'Send', disabled: S.coachBusy, onclick: () => { const t = ta.value.trim(); if (!t) return; S.coachDraft = ''; askCoach('ask', t); } }),
        S.coachBusy ? h('button', { class: 'btn', type: 'button', text: 'Stop', onclick: () => { S.ctl && S.ctl.abort(); } }) : null));
    root.append(comp);
  }
  return root;
}
function coachItem(it, opts = {}) {
  const box = h('div', { class: 'stack' });
  if (!opts.bare) {
    if (it.kind === 'ask' || it.kind === 'answers') box.append(h('div', { class: 'msg you' }, h('span', { class: 'who', text: it.kind === 'answers' ? 'Your answers' : 'You' }), h('div', { class: 'bubble', text: it.prompt })));
    else box.append(h('div', { class: 'small muted', text: `${it.prompt} · ${fmtDate(it.ts)}` }));
  }
  const card = opts.bare ? h('div', { class: 'msg' }) : h('div', { class: 'card msg' }, h('span', { class: 'who', text: 'Coach' }));
  if (it.status === 'thinking') {
    card.append(h('p', { class: 'muted', text: 'Thinking… this can take up to a minute.' }));
    card.append(h('div', {}, h('button', { class: 'btn', type: 'button', text: 'Stop', onclick: () => { S.ctl && S.ctl.abort(); } })));
    box.append(card); return box;
  }
  card.append(h('p', { class: 'reply', text: it.reply }));
  if (it.status === 'error' && it.reply !== 'Stopped.' && coachReady()) card.append(h('div', {}, h('button', { class: 'btn', type: 'button', text: 'Try again', disabled: S.coachBusy, onclick: () => { S.thread.items = S.thread.items.filter(x => x !== it); const prev = it.prevId ? S.thread.items.find(x => x.id === it.prevId) : null; askCoach(it.kind, it.kind === 'ask' || it.kind === 'answers' ? it.prompt : '', prev); } })));
  const pending = (it.changes || []).filter(c => c.state === 'pending');
  if ((it.changes || []).length) {
    const cl = h('div', {}, h('div', { class: 'eyebrow', text: 'Suggested changes' }));
    for (const c of it.changes) {
      const right = c.state === 'pending'
        ? h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', text: 'Apply', onclick: () => applyChanges(it, [c]) }), h('button', { class: 'btn', type: 'button', text: 'Dismiss', onclick: async () => { c.state = 'dismissed'; await saveThread(); renderMain(); } }))
        : c.state === 'applied'
          ? h('div', { class: 'row' }, h('span', { class: 'pill go', text: c.auto ? 'Applied automatically' : 'Applied' }), c.prev ? h('button', { class: 'link', type: 'button', text: 'Undo', onclick: () => undoChange(it, c) }) : null)
          : h('span', { class: 'pill', text: c.state === 'undone' ? 'Undone' : 'Dismissed' });
      cl.append(h('div', { class: 'change' }, h('b', { text: describeChange(c) }), c.reason ? h('div', { class: 'why', text: c.reason }) : null, h('div', {}, right)));
    }
    if (pending.length > 1) cl.append(h('button', { class: 'btn block', type: 'button', text: `Apply all ${pending.length}`, onclick: () => applyChanges(it, pending) }));
    card.append(cl);
  }
  const qs = it.questions || [];
  if (qs.length) {
    const qb = h('div', { class: 'stack' }, h('div', { class: 'eyebrow', text: 'The coach needs to know' }));
    const answered = it.answersSent;
    S.qd = S.qd || {};
    const draft = q => (S.qd[`${it.id}:${q.id}`] = S.qd[`${it.id}:${q.id}`] || { answer: q.answer || null, text: q.answerText || '' });
    for (const q of qs) {
      const d = answered ? { answer: q.answer, text: q.answerText } : draft(q);
      const g = h('div', { class: 'q' }, h('div', { text: q.text }));
      if (q.options.length) {
        const chips = h('div', { class: 'chips' });
        for (const o of q.options) chips.append(h('button', { class: 'chip', type: 'button', disabled: answered, 'aria-pressed': String(d.answer === o), text: o, onclick: () => { d.answer = d.answer === o ? null : o; renderMain(); } }));
        g.append(chips);
      }
      if (q.allowText && !answered) { const inp = h('input', { type: 'text', id: `qa-${it.id}-${q.id}`, placeholder: 'Or answer in your own words', value: d.text || '' }); inp.addEventListener('input', () => { d.text = inp.value; }); g.append(inp); }
      else if (answered && q.answerText) g.append(h('div', { class: 'small', text: `“${q.answerText}”` }));
      qb.append(g);
    }
    if (!answered) qb.append(h('button', { class: 'btn primary', type: 'button', text: 'Send answers', disabled: S.coachBusy, onclick: () => {
      for (const q of qs) { const d = draft(q); q.answer = d.answer; q.answerText = (d.text || '').trim(); }
      const lines = qs.map(q => `${q.text} → ${[q.answer, q.answerText].filter(Boolean).join('; ') || 'no answer'}`).join('\n');
      it.answersSent = true; askCoach('answers', lines, it);
    } }));
    card.append(qb);
  }
  box.append(card);
  return box;
}

/* ---------- SETTINGS & FIRST RUN ---------- */
function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function ago(ms) {
  if (!ms) return 'never';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
async function connectSheet(url) {
  url = String(url || '').trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) { toast('That doesn’t look like an Apps Script web app link. It starts with https://script.google.com/macros/s/ and ends in /exec.'); return; }
  Store.sync.url = url; Store.sync.lastPull = 0; Store.sync.lastError = ''; Store.saveSync();
  S.connecting = true; renderMain();
  const ok = await Sync.run({ full: true });
  S.connecting = false;
  loadFromStore();
  if (ok && S.program) { toast('Connected. Your program and history are on this phone.'); S.tab = 'today'; markTab(); }
  else if (!ok) toast('Couldn’t reach the sheet: ' + (Store.sync.lastError || 'unknown error'));
  renderTop(); renderMain();
}
function viewWelcome() {
  const root = h('div', { class: 'stack' });
  if (Store.sync.url && (Sync.running || S.connecting)) {
    root.append(h('div', { class: 'card' }, h('p', { class: 'muted', text: 'Loading your program from your Google Sheet…' })));
    return root;
  }
  root.append(h('div', {}, h('div', { class: 'eyebrow', text: 'First run' }), h('h2', { text: 'Connect your data' })));
  root.append(h('div', { class: 'card' },
    h('p', { text: 'Your program, sessions and coach notes live in the Google Sheet “Size & Rehab Coach data”. Paste the web app link from that sheet to load them onto this phone.' }),
    Store.sync.lastError ? h('div', { class: 'warn stop', text: `Last try failed: ${Store.sync.lastError}` }) : null,
    h('div', {}, h('button', { class: 'btn primary', type: 'button', text: 'Open Settings', onclick: () => setTab('settings') }))));
  if (!isStandalone()) root.append(installHint());
  return root;
}
function installHint() {
  return h('div', { class: 'card' }, h('b', { text: 'Put it on your Home Screen' }),
    h('p', { class: 'small', text: 'In Safari, tap the Share button, then Add to Home Screen. Open it from the new icon and it runs full screen like an app.' }));
}
function viewSettings() {
  const root = h('div', { class: 'stack' });
  root.append(h('div', {}, h('div', { class: 'eyebrow', text: 'Settings' }), h('h2', { text: 'Data and coach' })));

  // sheet link
  const s = Store.sync; const st = syncState();
  const sheetCard = h('div', { class: 'card' }, h('h3', { text: 'Google Sheet' }));
  const url = h('input', { type: 'url', id: 'sheet-url', placeholder: 'https://script.google.com/macros/s/…/exec', value: s.url || '', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  sheetCard.append(h('label', { class: 'q', for: 'sheet-url' }, h('span', { class: 'q-label', text: 'Web app link (from Extensions > Apps Script > Deploy)' }), url));
  const dl = h('dl', { class: 'kv' },
    h('dt', { text: 'Status' }), h('dd', { text: st === 'off' ? 'Not connected' : st === 'ok' ? 'Up to date' : st === 'pending' ? (navigator.onLine ? 'Changes waiting to upload' : 'Offline: changes are saved on the phone') : 'Problem reaching the sheet' }),
    h('dt', { text: 'Last synced' }), h('dd', { text: ago(s.lastOk) }),
    h('dt', { text: 'Waiting' }), h('dd', { text: `${Store.pendingCount()} change${Store.pendingCount() === 1 ? '' : 's'}` }));
  if (s.lastError) dl.append(h('dt', { text: 'Error' }), h('dd', { text: s.lastError }));
  sheetCard.append(dl);
  sheetCard.append(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', text: s.url && url.value === s.url ? 'Sync now' : 'Connect', disabled: S.connecting || Sync.running,
      onclick: () => { if (url.value.trim() !== s.url) connectSheet(url.value); else Sync.run().then(ok => toast(ok ? 'Synced.' : 'Sync failed: ' + Store.sync.lastError)); } })));
  url.addEventListener('input', () => { const b = sheetCard.querySelector('.btn.primary'); if (b) b.textContent = url.value.trim() && url.value.trim() === s.url ? 'Sync now' : 'Connect'; });
  root.append(sheetCard);

  // API key
  const keyCard = h('div', { class: 'card' }, h('h3', { text: 'Coach (Claude API)' }),
    h('p', { class: 'small muted', text: 'Used for the review after each session and for questions you send. The key stays on this phone and is sent only to Anthropic.' }));
  const key = h('input', { type: 'password', id: 'api-key', placeholder: 'sk-ant-…', value: Settings.apiKey || '', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  const model = h('select', { id: 'model' }, [['claude-sonnet-5-5', 'Sonnet 5.5 (recommended)'], ['claude-opus-5-5', 'Opus 5.5'], ['claude-haiku-5-5', 'Haiku 5.5']]
    .map(([v, t]) => h('option', { value: v, selected: Settings.model === v ? 'selected' : null, text: t })));
  keyCard.append(h('label', { class: 'q', for: 'api-key' }, h('span', { class: 'q-label', text: 'API key' }), key));
  keyCard.append(h('label', { class: 'q', for: 'model' }, h('span', { class: 'q-label', text: 'Model' }), model));
  const keyMsg = h('p', { class: 'small', 'aria-live': 'polite' });
  keyCard.append(h('div', { class: 'row' },
    h('button', { class: 'btn primary', type: 'button', text: 'Save', onclick: () => { Settings.apiKey = key.value.trim(); Settings.model = model.value; saveSettings(); toast(Settings.apiKey ? 'Saved. The coach is on.' : 'Key removed. The coach is off.'); renderMain(); } }),
    h('button', { class: 'btn', type: 'button', text: 'Check key', onclick: async ev => {
      const btn = ev.currentTarget; btn.disabled = true; keyMsg.textContent = 'Checking…';
      const keep = { apiKey: Settings.apiKey, model: Settings.model };
      Settings.apiKey = key.value.trim(); Settings.model = model.value;
      try { await callClaude('Reply with {"ok":true}', { maxTokens: 20 }); keyMsg.textContent = 'The key works.'; }
      catch (e) { keyMsg.textContent = errorCopy(e); }
      finally { Settings.apiKey = keep.apiKey; Settings.model = keep.model; btn.disabled = false; }
    } })), keyMsg);
  root.append(keyCard);

  if (!isStandalone()) root.append(installHint());
  root.append(h('p', { class: 'small muted', text: 'Everything you log is saved on this phone first and uploads to the sheet when you’re online. The Sunday check-in reads the sheet.' }));
  return root;
}
function markTab() {
  for (const b of document.querySelectorAll('.tab')) b.removeAttribute('aria-current');
  const tb = document.querySelector(`.tab[data-tab="${S.tab}"]`); if (tb) tb.setAttribute('aria-current', 'page');
}

/* ---------- boot ---------- */
for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => setTab(b.dataset.tab));
$('#settings-btn').addEventListener('click', () => setTab(S.tab === 'settings' ? 'today' : 'settings'));

function start() {
  S.ready = true;
  loadFromStore();
  const d = Store.get('app/draft');
  if (d && d.session) { S.active = d.session; S.resumed = true; }
  if (!S.program && !Store.sync.url) S.tab = 'settings';
  markTab(); renderTop(); renderMain(); updateSyncDot();
  applyIncoming();
  if (Store.sync.url) Sync.run();
  window.addEventListener('online', () => Sync.run());
  window.addEventListener('offline', updateSyncDot);
  let lastVis = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastVis > 30000) { lastVis = Date.now(); Sync.run(); }
  });
  setInterval(() => { if (document.visibilityState === 'visible') Sync.run(); }, 5 * 60 * 1000);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
start();
})();
