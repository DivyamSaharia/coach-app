<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Size &amp; Rehab Coach</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0b0a">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Coach. One phone-width column for gym use, one theme (Ember).
   Coral to magenta is the action colour, gold is XP, violet is a PR, green is done.
   The rank badge is a bumper plate in the tier's colour. The overhaul rules are at the end of this sheet. */
:root{
  --bg:#0e0b0a; --surface:#191413; --raised:#231c1a; --sunk:#322824; --ink:#fff4ec; --muted:#b8a69c; --line:rgba(255,244,236,.09);
  --accent:#ff7a45; --accent2:#ff4d86; --accent-soft:#3b2018; --on-accent:#1f0700;
  --xp:#ffd84a; --xp-ink:#ffd84a; --xp-soft:#3a3010;
  --pr:#bb98ff; --pr-soft:#2e2248; --on-pr:#12052e;
  --go:#4ce3a1; --go-soft:#12352a; --on-go:#02170e; --hold:#f2b544; --hold-soft:#3a2c14; --stop:#ff6b6b; --stop-soft:#3f1d1f;
  --hub:#0e0b0a;
  --plate-25:#d92d3a; --plate-20:#2454e6; --plate-15:#f0b400; --plate-10:#17804a; --plate-5:#f4f4f2; --plate-2:#9aa3ad;
  --plate-ink:#ffffff; --plate-ink-dark:#151515;
  --display:"Chakra Petch","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; --r-sm:14px;
  --shadow:none;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.6,.5,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
button,.tab,.chip,.link,summary,.vid,label.check{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.num,.tnum{font-variant-numeric:tabular-nums}
.icon-btn{appearance:none;position:relative;border:0;background:transparent;color:var(--ink);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;margin-right:-8px}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--bg)}
.icon-btn .dot.go{background:var(--go)} .icon-btn .dot.hold{background:var(--hold)} .icon-btn .dot.stop{background:var(--stop)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:1.6rem}
h3{font-size:1.18rem}
p{margin:0}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in,.wrap,.tabs-in,.rest-in{max-width:640px;margin:0 auto}
.top-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font:600 1.12rem/1 var(--display)}
.brand .mini{width:26px;height:26px;flex:none}
.brand small{font:500 .82rem/1 var(--body);color:var(--muted)}
.status{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.status:empty{display:none}
.pill{font:600 .78rem/1 var(--body);padding:6px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.go{background:var(--go-soft);color:var(--go)}
.pill.hold{background:var(--hold-soft);color:var(--hold)}
.pill.stop{background:var(--stop-soft);color:var(--stop)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.xp{background:var(--xp-soft);color:var(--xp-ink)}
.pill.pr{background:var(--pr-soft);color:var(--pr)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 150px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 .86rem/1.25 var(--body);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.flag-hold{border-color:var(--hold)}
.card.flag-stop{border-color:var(--stop)}
.card.flag-blue{border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:600 1rem/1.1 var(--body);padding:11px 16px;border-radius:var(--r-sm);min-height:44px;cursor:pointer;text-align:center}
.btn.primary{background:linear-gradient(100deg,var(--accent),var(--accent2));border-color:transparent;color:var(--on-accent);box-shadow:0 10px 22px -12px var(--accent2)}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font:600 1.15rem/1.1 var(--display);min-height:54px;padding:14px 20px}
.link{appearance:none;background:none;border:0;color:var(--accent);font:600 .95rem/1.2 var(--body);padding:6px 0;cursor:pointer;text-align:left}
.vid{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font:600 .92rem/1.2 var(--body);text-decoration:none;padding:4px 0}
.vid:hover{text-decoration:underline}
.vid svg{width:13px;height:13px;flex:none}
.prep-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prep-row .vid{flex:none;font-size:.85rem}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.vid:focus-visible,.tab:focus-visible,.done-btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,.hud:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:500 .93rem/1 var(--body);padding:9px 12px;border-radius:999px;min-height:38px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.n{min-width:36px;padding:9px 0;text-align:center;font-family:var(--display);font-weight:600}
.chip.n.v-go[aria-pressed="true"]{background:var(--go);border-color:var(--go)}
.chip.n.v-hold[aria-pressed="true"]{background:var(--hold);border-color:var(--hold);color:#1b1300}
.chip.n.v-stop[aria-pressed="true"]{background:var(--stop);border-color:var(--stop)}
.q{display:flex;flex-direction:column;gap:6px}
.q-label{font:500 .9rem/1.3 var(--body);color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],textarea,select{font:500 1rem/1.3 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}

/* Rank HUD */
.emblem{display:block;flex:none}
.hud{appearance:none;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--tier) 26%,transparent),transparent 60%),var(--surface);box-shadow:var(--shadow)}
.hud-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.rank-name{font:700 1.55rem/1 var(--display);letter-spacing:-.01em}
.rank-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.rank-xp{font:600 .9rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{position:relative;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.xpbar>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--xp) 70%,#fff 0%),var(--xp));box-shadow:0 0 12px -2px var(--xp)}
.xpbar.thin{height:6px}
.xpbar.blue>i{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:none}
.xpbar.go>i{background:var(--go);box-shadow:none}
.hud-sub{font-size:.86rem;color:var(--muted);margin-top:6px}
.hud-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.streak{display:inline-flex;align-items:center;gap:6px;font:600 .86rem/1 var(--body);padding:6px 10px 6px 8px;border-radius:999px;background:var(--pr-soft);color:var(--pr)}
.streak svg{width:15px;height:15px}
.streak.cold{background:var(--sunk);color:var(--muted)}

/* Quests */
.quests{display:flex;flex-direction:column;gap:12px}
.quest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.quest .qname{font-weight:600;font-size:.95rem}
.quest .qxp{font:600 .82rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums}
.quest .xpbar{grid-column:1/-1}
.quest.done .qname{color:var(--go)}
.quest.missed .qname{color:var(--muted);text-decoration:line-through}
.quest .qstate{font-size:.82rem;color:var(--muted);grid-column:1/-1;margin-top:-2px}

/* Next-up */
.next-day{font:700 2.5rem/.95 var(--display);letter-spacing:-.015em}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.daypick .chip{border-radius:var(--r-sm);text-align:left;padding:10px 12px;line-height:1.2}
.exlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.exlist li:first-child{border-top:0}
.exlist .t{font:600 .95rem/1.2 var(--display);color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.exlist .s{color:var(--muted);font-size:.85rem;grid-column:1/-1}

/* Logger */
.live{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(var(--top-h,64px) + 8px);z-index:5;padding:10px 14px;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.live-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.live-xp{font:700 1.1rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);transition:border-color .2s}
.ex.is-skipped{opacity:.62}
.ex.is-done{border-color:color-mix(in srgb,var(--go) 60%,var(--line))}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head h3{min-width:0}
.ex-num{font:600 .8rem/1 var(--body);color:var(--muted);display:flex;gap:8px;align-items:center}
.ex-prog{font:600 .78rem/1 var(--display);padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.ex.is-done .ex-prog{background:var(--go-soft);color:var(--go)}
.pr-flag{font:700 .72rem/1 var(--display);padding:4px 7px;border-radius:6px;background:var(--pr);color:#fff;letter-spacing:.04em}
.pres{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.pres .w{font:700 1.9rem/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.pres .sr{font:600 1.08rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tag{font:600 .78rem/1.2 var(--body);padding:5px 8px;border-radius:6px;background:var(--hold-soft);color:var(--hold);display:inline-block}
.plates{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.plate{font:700 .78rem/1 var(--display);padding:5px 6px;border-radius:4px;min-width:28px;text-align:center;color:var(--plate-ink)}
.plate.p25{background:var(--plate-25)} .plate.p20{background:var(--plate-20)} .plate.p15{background:var(--plate-15);color:var(--plate-ink-dark)}
.plate.p10{background:var(--plate-10)} .plate.p5{background:var(--plate-5);color:var(--plate-ink-dark);box-shadow:inset 0 0 0 1px var(--line)} .plate.p2{background:var(--plate-2);color:var(--plate-ink-dark)}
.sets{display:grid;grid-template-columns:2.8rem minmax(0,1fr) minmax(0,1fr) 3.6rem;gap:8px;align-items:center}
.sets .hd{font:600 .78rem/1 var(--body);color:var(--muted);text-align:center}
.setrow{display:contents}
.set-tag{position:relative;box-sizing:border-box;height:48px;padding:0;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--raised);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 1.08rem/1 var(--display)}
.set-tag-pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;margin:0;padding:0;min-height:0;appearance:none}
.set-tag:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.set-tag small{font:600 .68rem/1 var(--body);color:var(--muted)}
.set-tag[data-t="W"]{color:var(--muted);border-style:dashed}
.set-tag[data-t="F"]{color:var(--accent);border-color:var(--accent)}
.set-tag[data-t="D"]{color:var(--pr);border-color:var(--pr)}
.dev-card{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding:10px;font-size:.95rem;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:var(--r-sm)}
.dev-card p{margin:0}
.dev-card .row{gap:6px 18px;align-items:center}
.dev-card .btn{min-height:38px;padding:7px 14px;font-size:.93rem}
.num-in{height:48px;text-align:center;font:600 1.25rem/1 var(--display)!important;font-variant-numeric:tabular-nums;padding:0 6px!important;transition:background-color .2s,border-color .2s}
.setrow.done .num-in{background:var(--go-soft);border-color:var(--go)}
.setrow.pr .num-in{background:var(--pr-soft);border-color:var(--pr)}
.done-btn{height:48px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--raised);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.done-btn svg{width:24px;height:24px}
.done-btn[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff}
.setrow.pr .done-btn[aria-pressed="true"]{background:var(--pr);border-color:var(--pr)}
.bw-cell{font:500 .9rem var(--body);color:var(--muted);text-align:center}
details.prep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
details.prep summary{cursor:pointer;padding:14px 16px;font:600 1.08rem var(--display);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.prep summary::-webkit-details-marker{display:none}
details.prep.full summary .small{color:var(--go)}
details.prep .prep-list{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:22px;height:22px;min-height:0;margin-top:1px;flex:none;accent-color:var(--accent)}
.verdicts{display:flex;flex-direction:column;gap:8px}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.verdict .pill{justify-self:start}
.warn{background:var(--hold-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:.95rem}
.warn.stop{background:var(--stop-soft)}

/* Results */
.results{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(110% 120% at 50% 0%,color-mix(in srgb,var(--tier) 30%,transparent),transparent 62%),var(--surface);box-shadow:var(--shadow)}
.res-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.res-xp{font:700 3rem/1 var(--display);color:var(--xp-ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res-xp small{font-size:1.1rem;margin-left:4px}
.res-rank{display:flex;align-items:center;gap:12px;width:100%}
.res-rank .grow{flex:1;min-width:0}
.rankup{align-self:center;font:700 1rem/1 var(--display);padding:8px 14px;border-radius:999px;background:var(--xp);color:#1b1300;letter-spacing:.02em}
.parts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:.93rem;margin:0}
.parts dt{color:var(--muted)} .parts dd{margin:0;font:600 .95rem/1.3 var(--display);color:var(--xp-ink);text-align:right;font-variant-numeric:tabular-nums}
.prlist{display:flex;flex-direction:column;gap:6px}
.pritem{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--pr-soft)}
.pritem b{font-family:var(--display)}
.pritem .pr-flag{flex:none}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:34%;width:7px;height:12px;border-radius:2px;opacity:0}

/* Rank view */
.rank-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 16px 18px;border-radius:var(--r);border:1px solid var(--line);
  background:radial-gradient(90% 120% at 50% 0%,color-mix(in srgb,var(--tier) 34%,transparent),transparent 65%),var(--surface);box-shadow:var(--shadow)}
.rank-hero .rank-name{font-size:2.1rem}
.rank-hero .xpbar{width:100%;max-width:420px}
.lifts{display:flex;flex-direction:column;gap:14px}
.lift{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.lift .lname{font-weight:600}
.lift .ltier{font:600 1.05rem/1.1 var(--display)}
.lift .xpbar,.lift .lnext{grid-column:2}
.lift .lnext{font-size:.85rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 1.4rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--raised)}
.badge b{font:600 1rem/1.15 var(--display)}
.badge span{font-size:.84rem;color:var(--muted)}
.badge.got{border-color:color-mix(in srgb,var(--xp) 70%,var(--line));background:linear-gradient(160deg,var(--xp-soft),var(--raised) 70%)}
.badge.got b::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--xp);margin-right:6px;vertical-align:.1em}
.badge:not(.got){opacity:.75}
.ladder{display:flex;flex-direction:column}
.rung{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rung.passed{opacity:.6}

.rest{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:11;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:13;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-size:.95rem;max-width:min(92vw,520px)}
.toast.pr{background:var(--pr);color:#fff;font-weight:600}
/* Cues, warm-up sets, notes and folding */
.sticky{background:var(--xp-soft);border:1px solid color-mix(in srgb,var(--xp) 45%,var(--line));border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sticky-head{font:600 .82rem/1.2 var(--body);color:var(--xp-ink);letter-spacing:.02em;text-transform:uppercase}

.sticky .link{align-self:flex-start;padding:2px 0}

.cue-list{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:3px;font-size:.93rem}
details.cues summary{cursor:pointer;font:600 .9rem/1.3 var(--body);color:var(--muted);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.cues summary::-webkit-details-marker{display:none}
details.cues summary::after{content:"▾";font-size:.75rem}
details.cues[open] summary::after{content:"▴"}
details.cues[open] summary{margin-bottom:6px}
.coach-note{color:var(--ink)}
.coach-note b{color:var(--muted);font-weight:600}
.my-line{margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;margin-left:auto;align-self:center}
.seg-b{appearance:none;border:0;background:transparent;color:var(--muted);font:600 .82rem/1 var(--body);padding:7px 11px;min-height:32px;cursor:pointer}
.seg-b[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.setrow[data-t="W"] .num-in{height:42px;font-size:1.05rem!important;background:var(--raised)}
.setrow[data-t="W"] .done-btn,.setrow[data-t="W"] .set-tag{height:42px}
.notes{display:flex;flex-direction:column;gap:8px}

.note-bubble{background:var(--accent-soft);border-radius:var(--r-sm);padding:8px 12px;white-space:pre-wrap;font-size:.95rem}
.note-bubble.sent{background:var(--sunk)}
.note-acts{gap:16px}
.note-acts .link{font-size:.85rem;padding:2px 0}
.note-row.editing{gap:6px}
.fold-row,.ex-fold,.coach-fold{appearance:none;width:100%;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-radius:var(--r-sm);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.batch{display:flex;flex-direction:column;gap:8px}
.ex.folded{padding:0;box-shadow:none;background:transparent;border:0}

.ex.is-done .ex-fold{border-color:color-mix(in srgb,var(--go) 60%,var(--line))}
.fold-check{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--go-soft);color:var(--go);font-weight:700}

.fold-check svg{width:16px;height:16px}
.fold-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.fold-main b{font-family:var(--display);font-weight:600}
.fold-open{color:var(--accent);font-weight:600;flex:none}
.coach-fold{background:var(--surface);box-shadow:var(--shadow)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.conv{display:flex;flex-direction:column;gap:10px;min-width:0}

.coach-fold.day-fold{background:var(--raised);box-shadow:none}
.tab{position:relative}
.tab.waiting::after{content:"";position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--hold);box-shadow:0 0 0 2px var(--surface)}
.msg-acts{gap:18px}
details.remind{border:1px solid var(--line);border-radius:var(--r-sm)}
details.remind summary{cursor:pointer;padding:12px 14px;font:600 1rem var(--display);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.remind summary::-webkit-details-marker{display:none}

.rem-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}

.pct-chip{font:600 .74rem/1 var(--body);padding:4px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}

.tierup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--tier) 70%,transparent),rgba(4,7,18,.92) 62%);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .25s}

}
@keyframes tierin{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: no-preference){

  .xpbar>i{transition:width .9s cubic-bezier(.2,.8,.2,1)}

}

/* ===== Ember overhaul =====
   One theme. Surfaces are told apart by tone, not outlines. The action colour means "tap me" and nothing else;
   gold is only ever XP and violet only ever a PR. Every tappable thing answers the touch. */
h2{font-size:1.7rem}
.card,.ex,.trend,details.prep,details.sess,.hud,.results,.rank-hero,.exrank,details.remind,.badge,.stats{border:0;box-shadow:none}
.card.flag-hold{box-shadow:inset 0 0 0 1.5px var(--hold)}

.status{display:none}
.wrap{padding-block:10px 190px}
.eyebrow{font-size:.8rem;letter-spacing:.02em}

.card .chip[aria-pressed="true"],.ex .chip[aria-pressed="true"],details.prep .chip[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],input[type=search],textarea,select{border-color:transparent;background:var(--raised);border-radius:14px}
.card input:not([type=checkbox]):not([type=range]),.card textarea,.card select,.ex textarea,details.prep textarea,details.remind textarea,details.remind input{background:var(--sunk)}
.pill{background:var(--sunk)}
.pr-flag,.toast.pr{color:var(--on-pr)}

.btn,.chip,.tab,.link,.done-btn,.icon-btn,.ex-fold,.trend,.exbtn,.more-btn,.ringtile,.sheet-item,.finish-bar,.rest-box button,.brand,.coach-fold,.fold-row,summary{transition:transform .12s var(--ease),filter .12s,background-color .22s,color .22s}
.btn:active,.chip:active,.tab:active,.done-btn:active,.icon-btn:active,.ex-fold:active,.trend:active,.more-btn:active,.ringtile:active,.finish-bar:active,.rest-box button:active,.coach-fold:active,.fold-row:active{transform:scale(.97);filter:brightness(1.14)}
.link:active,.sheet-item:active,.exbtn:active,.brand:active{filter:brightness(1.3)}

/* tab bar with a sliding pill */
.tabs{border-top:0;background:color-mix(in srgb,var(--surface) 94%,transparent)}
.tabs-in{position:relative;padding:6px 0 4px}
.tab-pill{position:absolute;top:6px;left:0;width:20%;height:calc(100% - 10px);border-radius:16px;background:color-mix(in srgb,var(--accent) 16%,transparent);transition:transform .45s var(--spring);pointer-events:none}
.tab{z-index:1;padding:8px 2px}
.tab[aria-current="page"] svg{filter:none}
.tab.live::before{content:"";position:absolute;top:5px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--go);box-shadow:0 0 0 2px var(--surface)}

/* docked rest timer and Finish */
.dock{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:11;max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.dock>*{pointer-events:auto}
.rest-box{overflow:visible;display:flex;align-items:center;gap:12px;background:var(--sunk);color:var(--ink);border-radius:18px;padding:8px 8px 8px 10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);font:inherit}
.rest-ring{width:44px;height:44px;transform:rotate(-90deg);flex:none}
.rest-ring circle{fill:none;stroke-width:5;stroke:color-mix(in srgb,var(--ink) 14%,transparent)}
.rest-ring circle.v{stroke:var(--xp);stroke-linecap:round;stroke-dasharray:113.1;transition:stroke-dashoffset 1s linear}
.rest-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rest-t b{font:700 1.3rem/1 var(--display);font-variant-numeric:tabular-nums}
.rest-t span{font:500 .78rem/1.1 var(--body);color:var(--muted)}
.rest-box button{min-height:44px;padding:0 14px;border-radius:12px;background:color-mix(in srgb,var(--ink) 10%,transparent);font:600 .9rem/1 var(--body);color:inherit}
.rest-box.over{background:var(--go);color:var(--on-go)}
.rest-box.over .rest-t span{color:inherit}
.rest-box.over .rest-ring circle.v{stroke:var(--on-go)}
.finish-bar{appearance:none;position:relative;overflow:hidden;min-height:46px;border-radius:14px;border:0;background:var(--sunk);color:var(--ink);font:700 1rem/1 var(--display);cursor:pointer;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
.finish-bar i{position:absolute;inset:0;width:0;opacity:.35;background:linear-gradient(100deg,var(--accent),var(--accent2));transition:width .5s var(--ease),opacity .3s}
.finish-bar span{position:relative}
.finish-bar.full{color:var(--on-accent)}
.finish-bar.full i{opacity:1}
.toast{bottom:calc(196px + env(safe-area-inset-bottom,0px));border-radius:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}

/* logger */
.live{position:sticky;top:var(--top-h,56px);z-index:5;margin:0 -16px;padding:8px 16px 10px;border-radius:0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:8px}
.segs{display:flex;gap:4px}
.segs i{flex:1;min-width:2px;height:6px;border-radius:99px;background:var(--sunk);transition:background-color .3s}
.segs i.on{background:var(--go)}
.segs i.gap{margin-left:5px}
.live-top{align-items:baseline;justify-content:flex-start}
.live-xp{margin-left:auto;font-size:1.15rem}
.prc{font:700 .72rem/1 var(--display);padding:4px 7px;border-radius:6px;background:var(--pr);color:var(--on-pr)}
.ex{border-radius:var(--r);transition:background-color .3s}
.ex.is-done{background:color-mix(in srgb,var(--go) 8%,var(--surface))}
.ex-head{align-items:center}
.more-btn{appearance:none;width:44px;height:44px;border-radius:14px;background:var(--raised);border:0;color:var(--ink);display:grid;place-items:center;flex:none;cursor:pointer}
.more-btn svg{width:20px;height:20px}
.pres{gap:4px 12px}
.pres .w{flex-basis:100%;font-size:2.9rem;line-height:.95;letter-spacing:-.02em}
.pres .sr{font:500 .95rem/1.2 var(--body);color:var(--muted)}
.sets{grid-template-columns:2.6rem minmax(0,1fr) minmax(0,1fr) 60px;gap:8px}
.set-tag,.num-in,.done-btn{height:56px;border-radius:14px}
.set-tag{border:0;background:transparent}
.set-tag[data-t="W"]{border:0}
.set-tag[data-t="F"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.set-tag[data-t="D"]{box-shadow:inset 0 0 0 1.5px var(--pr)}
.num-in{background:var(--raised)!important;border:0!important;font-size:1.4rem!important}
.setrow.done .num-in{background:color-mix(in srgb,var(--go) 16%,var(--raised))!important}
.setrow.pr .num-in{background:color-mix(in srgb,var(--pr) 20%,var(--raised))!important}
.done-btn{border:0;background:var(--raised)}
.done-btn svg{width:28px;height:28px}
.done-btn[aria-pressed="true"]{color:var(--on-go)}
.setrow.pr .done-btn[aria-pressed="true"]{color:var(--on-pr)}
.setrow[data-t="W"] .num-in{height:44px;font-size:1.05rem!important;background:color-mix(in srgb,var(--raised) 60%,transparent)!important}
.setrow[data-t="W"] .done-btn,.setrow[data-t="W"] .set-tag{height:44px}
.bw-cell{display:grid;place-items:center;height:56px;border-radius:14px;background:var(--raised)}
.setrow[data-t="W"] .bw-cell{height:44px}
.dev-card{border:0;border-radius:14px}
.rate{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.rate>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:12px}
.rate.open{grid-template-rows:1fr}
.rate .chips{flex-wrap:nowrap}
.rate .chip{flex:1;min-height:46px;padding:9px 0;border-radius:12px;font:600 1rem/1 var(--display);text-align:center}
.pain-row{display:flex;align-items:center;gap:12px}
.pain-in{flex:1;min-width:0;height:36px;margin:0;accent-color:var(--go);background:transparent}
.pain-in.unset{opacity:.55}
.pain-out{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:700 1.2rem/1 var(--display);font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--muted);transition:background-color .2s,color .2s}
.pain-out.lo{background:var(--go-soft);color:var(--go)}
.pain-out.mid{background:var(--hold-soft);color:var(--hold)}
.pain-out.hi{background:var(--stop-soft);color:var(--stop)}
.fold-row,.ex-fold,.coach-fold{border:0}
.ex-fold{background:var(--surface);border-radius:var(--r);padding:14px 16px;min-height:58px}
.ex.is-done .ex-fold{background:color-mix(in srgb,var(--go) 8%,var(--surface))}
.fold-check.num{background:var(--sunk);color:var(--ink);font:600 .85rem/1 var(--display)}
.fold-open{color:var(--muted)}
.sticky{border:0}
.seg{border:0;background:var(--sunk)}
details.prep summary{min-height:56px}

/* Today */
.week{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px}
.flame{display:flex;align-items:center;gap:7px;min-width:0;font:600 .9rem/1.15 var(--body);color:var(--accent2)}
.flame svg{width:20px;height:20px;flex:none}
.flame b{font:700 1.3rem/1 var(--display)}
.flame.cold{color:var(--muted)}
.days{display:flex;gap:5px;margin:0;padding:0;list-style:none;flex:none}
.days li{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font:600 .68rem/1 var(--body);color:var(--muted);background:var(--surface)}
.days li.on{background:var(--accent2);color:var(--on-accent)}
.days li.today{box-shadow:inset 0 0 0 2px var(--accent2);color:var(--ink)}
.days li.on.today{color:var(--on-accent)}
.mcheck{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.mcheck h3{font-size:1.05rem}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 .chip{border-radius:12px;min-height:46px;padding:8px 4px;font-weight:600;text-align:center}
.hero{position:relative;border-radius:26px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden;min-width:0;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent2) 30%,transparent),transparent 62%),
             radial-gradient(90% 80% at 0% 100%,color-mix(in srgb,var(--accent) 21%,transparent),transparent 60%),var(--surface)}
.hero .next-day{font-size:3.8rem;line-height:.95;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.hero .next-day.long{font-size:2.6rem}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts .pill{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink);padding:7px 10px;font-size:.82rem;white-space:normal}
.facts .pill.go{background:var(--go-soft);color:var(--go)}
.facts .pill.hold{background:var(--hold-soft);color:var(--hold)}
.facts .pill.stop{background:var(--stop-soft);color:var(--stop)}
details.peek summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font:600 .95rem/1 var(--body);color:var(--muted);min-height:40px}
details.peek summary::-webkit-details-marker{display:none}
details.peek summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-right:4px;transition:transform .3s var(--ease)}
details.peek[open] summary::after{transform:rotate(225deg)}
.go-btn{position:relative;overflow:hidden;width:100%}
.go-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%)}
.btn.quiet{background:transparent;color:var(--muted);min-height:40px;font-size:.95rem}
.hero .daypick .chip{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.hero .daypick .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ringtile{appearance:none;border:0;cursor:pointer;background:var(--surface);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:500 .8rem/1.2 var(--body);color:var(--muted);min-width:0}
.ringtile .rt-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ringtile b{font:600 .78rem/1 var(--display);color:var(--xp-ink)}
.ringtile.done .ring circle.v{stroke:var(--go)}
.ringtile.done b{color:var(--go)}
.ringtile.missed{opacity:.6}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:6;stroke:var(--sunk)}
.ring circle.v{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 .95rem/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.ring.sm{width:40px;height:40px}
.ring.sm circle{stroke-width:7}
.ring.xp circle.v{stroke:var(--xp)}
details.lastsess{background:var(--surface);border-radius:18px}
details.lastsess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;min-height:56px}
details.lastsess summary::-webkit-details-marker{display:none}
details.lastsess .sess-body{padding:0 14px 14px}

/* results */
.results{border-radius:26px;padding:22px 16px 16px}
.res-xp{font-size:4.2rem;letter-spacing:-.03em}
.res-xp small{font-size:1.3rem}
.pritem{position:relative;overflow:hidden;border-radius:14px}
.pritem::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}

/* bottom sheet */
#sheet-scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;display:flex;flex-direction:column;max-height:82vh;overflow-y:auto}
#sheet::before{content:"";flex:none;width:40px;height:5px;border-radius:9px;background:var(--sunk);margin:0 auto 8px}
body.sheet-on #sheet-scrim{opacity:1;pointer-events:auto}
body.sheet-on #sheet{transform:none;visibility:visible;transition:transform .4s var(--ease)}
.sheet-title{font:600 1.05rem/1.2 var(--display);padding:6px 0 8px}
.sheet-item{appearance:none;flex:none;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);display:flex;align-items:center;min-height:54px;font:500 1.02rem/1.2 var(--body);text-align:left;text-decoration:none;width:100%;cursor:pointer}
.sheet-item:first-of-type{border-top:0}
.sheet-item.danger{color:var(--stop)}

/* effects layer and celebrations */
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.fly{position:absolute;font:700 1rem/1 var(--display);color:var(--xp-ink);white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.conf{position:absolute;width:8px;height:13px;border-radius:2px}
.wave{position:absolute;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 3px var(--pr);opacity:.9}
.hsw{position:fixed;left:-99px;top:0;opacity:0;pointer-events:none}
.cele{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;overflow:hidden;color:#fff4ec;cursor:pointer}
.cele[hidden]{display:none}
.cele.rk{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--tier) 55%,transparent),rgba(10,7,6,.94) 62%);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cele.pr{background:#0b0607}
.ce-eye{font:600 .82rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,244,236,.72)}
.rk-in,.pr-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 22px;width:100%;max-width:440px}
.rk-emb{position:relative;display:grid;place-items:center;width:250px;height:206px;perspective:700px}
.rk-slot{display:grid;place-items:center;filter:drop-shadow(0 0 26px color-mix(in srgb,var(--tier1) 60%,transparent))}
.wreath{position:absolute;inset:0;width:100%;height:100%}
.wreath ellipse{opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:center;transition:opacity .25s,transform .45s var(--spring)}
.landed .wreath ellipse{opacity:1;transform:none}
.swoosh{position:absolute;top:-20%;bottom:-20%;left:0;width:46%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-160%) skewX(-20deg);border-radius:0;padding:0}
.beam{position:absolute;left:50%;top:-10%;width:520px;height:120%;margin-left:-260px;opacity:0;transition:opacity .5s;
  background:conic-gradient(from 180deg at 50% 0,transparent -16deg,color-mix(in srgb,var(--tier1) 24%,transparent) -6deg,transparent 0deg,transparent 4deg,color-mix(in srgb,var(--tier1) 24%,transparent) 10deg,transparent 20deg)}
.landed .beam{opacity:1}
.rk-name{font:700 3.6rem/1 var(--display);letter-spacing:-.02em;background:linear-gradient(180deg,#fff,var(--tier1));-webkit-background-clip:text;background-clip:text;color:transparent}
.rk-sub{font:600 1.2rem/1.2 var(--display)}
.rk-from{font:600 .92rem/1 var(--body);padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.14)}
.rk-pct{font-size:.95rem;color:rgba(255,244,236,.8);max-width:34ch}
.rk-pct b{font:700 1.25rem/1 var(--display);color:var(--tier1)}
.rays{position:absolute;left:50%;top:40%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent2) 42%,transparent) 0 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%)}
.glowb{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 52%)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.pr-title{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:700;line-height:.82;letter-spacing:-.03em;
  background:linear-gradient(180deg,#fff 8%,var(--xp) 46%,var(--accent) 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(255,90,60,.55))}
.pr-title span:first-child{font-size:3.2rem;letter-spacing:.12em;margin-right:-.12em}
.pr-title span:last-child{font-size:10.5rem}
.pr-lift{font:700 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.pr-cmp{width:100%;max-width:310px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pr-track{position:relative;height:14px;border-radius:99px;background:rgba(255,255,255,.14)}
.pr-track i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--xp));box-shadow:0 0 18px var(--xp);transition:width 1s var(--ease)}
.pr-track em{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:3px;background:#fff4ec}
.pr-nums{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.88rem;color:rgba(255,244,236,.72);text-align:left}
.pr-nums b{font:700 1.5rem/1 var(--display);color:var(--xp);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.pr-chips span{font:700 .95rem/1 var(--display);padding:9px 13px;border-radius:99px;background:var(--xp);color:#1b1300}
.pr-chips span+span{background:var(--pr);color:var(--on-pr)}
.hint{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:.85rem;color:rgba(255,244,236,.6)}
.cele .late{opacity:0}
.cele .late.in{opacity:1}

@media (prefers-reduced-motion: no-preference){
  .wrap.enter>.stack>*{animation:rise .38s var(--ease) both}
  .wrap.enter>.stack>*:nth-child(2){animation-delay:40ms} .wrap.enter>.stack>*:nth-child(3){animation-delay:80ms} .wrap.enter>.stack>*:nth-child(4){animation-delay:120ms}
  .wrap.enter>.stack>*:nth-child(5){animation-delay:160ms} .wrap.enter>.stack>*:nth-child(6){animation-delay:200ms} .wrap.enter>.stack>*:nth-child(n+7){animation-delay:240ms}
  .wrap.enter>.stack>.live{animation:none}
  .go-btn::after{animation:shine 3.2s 1s ease-in-out infinite}
  .setrow.fresh .num-in{animation:cellflash .6s var(--ease)}
  .done-btn[aria-pressed="true"] svg path,.done-btn[aria-pressed="true"] svg polyline{stroke-dasharray:30;animation:draw .35s .05s var(--ease) both}
  .segs i.on{animation:segpop .4s var(--spring)}
  .rest-box.over{animation:pulse .5s ease-in-out 2}
  .toast:not([hidden]){animation:rise .25s var(--ease)}
  .ex.just-done .fold-check{animation:stampin .45s var(--spring) both}
  .mcheck.gone{animation:shrink .4s var(--ease) forwards}
  .results.anim .parts>*{animation:rise .3s var(--ease) both;animation-delay:calc(var(--i,0) * 80ms + .45s)}
  .results.anim .pritem{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 160ms + 1.5s)}
  .results.anim .pritem::after{animation:shine 1.1s ease-out both;animation-delay:calc(var(--i,0) * 160ms + 1.8s)}
  .rays{animation:rayspin 16s linear infinite}
  .glowb{animation:breathe 1.2s ease-in-out infinite}
  .swoosh{animation:streakx .55s ease-out forwards}
  .cele.rk .ce-eye{animation:rise .35s .05s var(--ease) both}
  .rk-name{animation:slam .5s .78s var(--spring) both}
  .rk-sub{animation:rise .35s 1.02s var(--ease) both}
  .rk-from{animation:rise .35s 1.12s var(--ease) both}
  .rk-pct{animation:rise .35s 1.22s var(--ease) both}
  .cele.pr .ce-eye{animation:rise .3s .1s var(--ease) both}
  .pr-title{animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
  .pr-lift{animation:slam .45s .6s var(--spring) both}
  .cele .late{transform:translateY(10px) scale(.9);transition:opacity .3s,transform .45s var(--spring)}
  .cele .late.in{transform:none}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes cellflash{0%{box-shadow:0 0 0 0 var(--go);filter:brightness(1.6)}100%{box-shadow:0 0 0 10px transparent;filter:none}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes segpop{0%{transform:scaleY(2.4)}100%{transform:none}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes stampin{0%{transform:scale(2.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes shrink{to{opacity:0;transform:scale(.94);max-height:0;padding-block:0;margin-top:-14px}}
@keyframes rayspin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.6}}
@keyframes streakx{to{transform:translateX(390%) skewX(-20deg)}}
@keyframes slam{0%{transform:scale(3.4);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.mcheck{max-height:260px}
#finish-card{scroll-margin-top:130px}

/* Rank, History, Program, Coach, loading */
details.info summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font:600 .82rem/1 var(--body);color:var(--muted);min-height:32px}
details.info summary::-webkit-details-marker{display:none}

const Sync = {

  async run(opts = {}) {

    const res = await fetch(s.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ op: 'push', items }) });
    const out = await res.json();

    const res = await fetch(`${s.url}${s.url.includes('?') ? '&' : '?'}op=pull&since=${since}`);
    const out = await res.json();

function parseJsonLoose(text) {
  const t = String(text || '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) { try { return JSON.parse(fence[1]); } catch (e) {} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: 'invalid_json', message: 'Reply was not JSON', text: t };
}
async function callClaude(input, opts = {}) {
  if (!Settings.apiKey) throw { code: 'no_key' };
  if (!navigator.onLine) throw { code: 'offline' };
  const messages = typeof input === 'string' ? [{ role: 'user', content: input }] : input;
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: opts.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': Settings.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: opts.model || Settings.model || 'claude-sonnet-5-5', max_tokens: opts.maxTokens || 2500,
        system: opts.system || 'You are the coach inside a personal training app. Your reply is parsed by the app: reply with only one JSON object and no other text.', messages }),
    });
  } catch (e) {
    if (e && e.name === 'AbortError') throw { code: 'cancelled' };
    throw { code: 'offline', message: String(e) };
  }
  const raw = await res.text();
  if (!res.ok) {
    let msg = raw; try { msg = JSON.parse(raw).error.message; } catch (e) {}
    const code = res.status === 401 ? 'bad_key' : res.status === 429 ? 'rate_limited' : res.status === 529 ? 'overloaded'
      : /credit balance/i.test(msg) ? 'no_credit' : res.status === 404 ? 'bad_model' : 'upstream_error';
    throw { code, message: msg };
  }
  const data = JSON.parse(raw);
  return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
}

          h('button', { class: 'link', type: 'button', text: 'Cancel', onclick: () => { S.coachEdit = null; renderMain(); } }))));

    if (it.kind === 'ask' || it.kind === 'answers' || it.kind === 'exnote') box.append(h('div', { class: 'msg you' }, named ? null : h('span', { class: 'who', text: itemLabel(it) }), h('div', { class: 'bubble' + (opts.compact ? ' clamp3' : ''), text: it.kind === 'exnote' ? it.noteText : it.prompt })));

  }

    S.thread.items = S.thread.items.filter(x => x !== it); it.deleted = true; Store.set('coach/thread', { items: [clone(it)] });

        ? h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', text: live ? 'Swap it in today' : 'Apply', onclick: () => applyChanges(it, [c]) }), h('button', { class: 'btn', type: 'button', text: 'Dismiss', onclick: async () => { c.state = 'dismissed'; await saveThread(); renderMain(); } }))

}

/* ---------- SETTINGS & FIRST RUN ---------- */
function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function ago(ms) {
  if (!ms) return 'never';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
async function connectSheet(url) {
  url = String(url || '').trim();

  Store.sync.url = url; Store.sync.lastPull = 0; Store.sync.lastError = ''; Store.saveSync();
  S.connecting = true; renderMain();
  const ok = await Sync.run({ full: true });
  S.connecting = false;
  loadFromStore();
  if (ok && S.program) { toast('Connected. Your program and history are on this phone.'); S.tab = 'today'; markTab(); }
  else if (!ok) toast('Couldn’t reach the sheet: ' + (Store.sync.lastError || 'unknown error'));
  renderTop(); renderMain();
}
function viewWelcome() {

    root.append(h('p', { class: 'muted small', text: 'Loading your program from your Google Sheet…' }), h('div', { class: 'skel', style: 'height:300px' }), h('div', { class: 'skel', style: 'height:110px' }));
    return root;
  }
  root.append(h('div', {}, h('div', { class: 'eyebrow', text: 'First run' }), h('h2', { text: 'Connect your data' })));
  root.append(h('div', { class: 'card' },
    h('p', { text: 'Your program, sessions and coach notes live in the Google Sheet “Size & Rehab Coach data”. Paste the web app link from that sheet to load them onto this phone.' }),
    Store.sync.lastError ? h('div', { class: 'warn stop', text: `Last try failed: ${Store.sync.lastError}` }) : null,
    h('div', {}, h('button', { class: 'btn primary', type: 'button', text: 'Open Settings', onclick: () => setTab('settings') }))));
  if (!isStandalone()) root.append(installHint());
  return root;
}
function installHint() {
  return h('div', { class: 'card' }, h('b', { text: 'Put it on your Home Screen' }),

}
function viewSettings() {
  const root = h('div', { class: 'stack' });

  const url = h('input', { type: 'url', id: 'sheet-url', placeholder: 'https://script.google.com/macros/s/…/exec', value: s.url || '', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });

    h('button', { class: 'btn primary', type: 'button', text: 'Save', onclick: () => { Settings.apiKey = key.value.trim(); Settings.model = model.value; saveSettings(); toast(Settings.apiKey ? 'Saved. The coach is on.' : 'Key removed. The coach is off.'); renderMain(); } }),
    h('button', { class: 'btn', type: 'button', text: 'Check key', onclick: async ev => {
      const btn = ev.currentTarget; btn.disabled = true; keyMsg.textContent = 'Checking…';

    h('input', { type: 'checkbox', id: 'auto-review', checked: S.program.settings?.autoReview !== false, onchange: async ev => {

    h('span', {}, h('b', { text: 'Review every session automatically' }), h('br'), h('span', { class: 'small muted', text: 'Runs when you tap Finish. Small changes apply straight away with an Undo; exercise swaps and weight jumps over 15% wait for you. A weekly check-in also runs every Sunday night.' }))));
  root.append(keyCard);

  // next-set prompts: when a logged set lands this far from the plan, a card suggests the next set

    const dv = devSettings(S.program);
    const devCard = h('div', { class: 'card', id: 'dev-settings' }, h('h3', { text: 'Next-set prompts' }),

    const numField = (id, label, val, min, max) => {
      const inp = h('input', { type: 'number', id, inputmode: 'numeric', min: String(min), max: String(max), step: '1', value: String(val) });
      inp.addEventListener('change', async () => {
        const v = Math.round(Number(inp.value));

function markTab() {
